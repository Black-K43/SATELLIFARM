     ayuda:TR(`These are the most common problems of ${nom(c).toLowerCase()}. Look at the picture and the signs. You can pick several.`,`Son los problemas más comunes del ${nom(c).toLowerCase()}. Mire el dibujo y las señales. Puede marcar varios.`,
              `Main pests/diseases of ${nom(c).toLowerCase()}. Reported presence raises the pest risk to high.`,`Principales plagas/enfermedades del ${nom(c).toLowerCase()}. Si se reporta presencia, el riesgo de plagas sube a alto.`),
     opciones:[...c.plagas.map((p,i)=>({v:'p'+i, t:tx(p), plaga:p})), {v:'hongos', t:LG('Fungus / leaf spots','Hongos / manchas en hojas'), plaga:null}, {v:'ninguno',t:LG('✅ None of these','✅ Ninguno de estos')}, NOSE()]}
  ];
  // Erosion question only if the satellite (SRTM) says the field is NOT flat
  if(s.pendiente==null || s.pendiente >= PLANO) qs.push({id:'erosion', e:'⛰',
     t:LG('Have you seen rain wash soil away?','¿Ha visto que la lluvia se lleve la tierra?'),
     ayuda:TR(s.pendiente==null ? 'For example: small channels or ditches after a storm.' : `Your field has some slope (about ${s.pendiente}%). For example: small channels or ditches after a storm.`, s.pendiente==null ? 'Por ejemplo: surquitos o zanjas después de un aguacero.' : `Su lote tiene algo de pendiente (cerca de ${s.pendiente}%). Por ejemplo: surquitos o zanjas después de un aguacero.`,
              `SRTM slope ≈ ${s.pendiente}% (≥ ${PLANO}%: erosion-prone). Observed rills/gullies are added to the erosion score.`,`Pendiente SRTM ≈ ${s.pendiente}% (≥ ${PLANO}%: propensa a erosión). Surcos/cárcavas observados se suman al puntaje de erosión.`),
     opciones:[{v:'no',t:'No'},{v:'surcos',t:LG('Small rills','Surquitos pequeños')},{v:'carcavas',t:LG('Large gullies','Zanjas grandes (cárcavas)')},NOSE()]});
  return qs.map(q => (q.fuente===null || q.fuente===undefined || q.fuente==='null') ? {...q, fuente:null} : q);
}

function iniciarPreguntas(){ estado.qs = construirPreguntas(); estado.qi = 0; renderQ(); }

function renderQ(){
  const q = estado.qs[estado.qi], val = estado.resp[q.id], c = C(estado.cultivo);
  document.getElementById('barraQ').style.width = (estado.qi/estado.qs.length*100)+'%';
  const sel = v => q.multi ? (val||[]).includes(v) : val===v;
  document.getElementById('q').innerHTML = `
    <p class="sub">${LG(`Question ${estado.qi+1} of ${estado.qs.length}`,`Pregunta ${estado.qi+1} de ${estado.qs.length}`)} · ${LG('Crop','Cultivo')}: ${c.emoji} ${nom(c)}</p>
    <h2>${q.e} ${q.t}</h2>
    <p class="sub" style="font-size:1.05rem">${q.ayuda}</p>
    ${q.fuente?`<div class="fuente" style="font-size:.9rem">${q.fuente}</div>`:''}
    ${q.tipo==='plagas'
      ? `<div class="plagaGrid">${q.opciones.map(o=>{
            if(o.v==='ninguno'||o.v==='nose') return `<button class="plaga ${sel(o.v)?'sel':''}" style="justify-content:center;align-items:center;font-size:1.1rem;font-weight:600" onclick="resp('${q.id}','${o.v}')">${o.t}</button>`;
            const inf = infoPlaga(o.plaga);
            return `<div class="plaga ${sel(o.v)?'sel':''}" role="button" tabindex="0" onclick="resp('${q.id}','${o.v}')">${icoPlaga(inf.ico, inf.col)}
              <b>${sel(o.v)?'☑':'☐'} ${o.t}</b>${ING()&&inf.sci?`<small><i>${inf.sci}</i></small>`:''}
              <small>👀 ${tx(inf.s)}</small>
              ${inf.wiki?`<a href="https://en.wikipedia.org/wiki/${inf.wiki}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${LG('📷 See real photos','📷 Ver fotos reales')}</a>`:''}</div>`; }).join('')}</div>`
      : `<div class="opts grande">${q.opciones.map(o=>`<button class="opt ${sel(o.v)?'sel':''}" onclick="resp('${q.id}','${o.v}')">${o.t}</button>`).join('')}</div>`}`;
  actualizarFlor();
  const b = document.getElementById('bq');
  b.disabled = q.multi ? !(val && val.length) : !val;
  b.textContent = estado.qi===estado.qs.length-1 ? LG('See results →','Ver resultados →') : LG('Next →','Siguiente →');
}

function resp(id, v){
  const q = estado.qs.find(x=>x.id===id);
  if(q.multi){
    let a = estado.resp[id] || [];
    if(v==='ninguno' || v==='nose') a = a.includes(v) ? [] : [v];
    else { a = a.filter(x=>x!=='ninguno' && x!=='nose'); a = a.includes(v) ? a.filter(x=>x!==v) : [...a, v]; }
    estado.resp[id] = a;
  } else estado.resp[id] = v;
  renderQ();
}
function qSig(){ if(estado.qi < estado.qs.length-1){ estado.qi++; renderQ(); } else ir(5); }
function qAtras(){ if(estado.qi>0){ estado.qi--; renderQ(); } else ir(3); }

/* ==========================================================================
   8) STEP 5 — RESULTS + "WHAT YOU CAN DO"
   ========================================================================== */
const EFIC = [   // typical application efficiency of irrigation systems (share of pumped water that reaches the roots)
  {k:'goteo',    n:{en:'Drip',es:'Goteo'}, e:0.90},
  {k:'aspersion',n:{en:'Sprinkler / center pivot',es:'Aspersión / pivote'}, e:0.80},
  {k:'surcos',   n:{en:'Furrow / flood',es:'Surcos / inundación'}, e:0.60}
];

function consejosAgua(r, z, R, n){
  const c = r.c, tips = [];
  const pico = r.agua.filas.reduce((a,f)=>f.def>a.def?f:a, r.agua.filas[0]);
  const mesCritico = (estado.mes-1 + Math.floor(c.ciclo*0.55)) % 12;     // flowering ≈ 55% of the cycle

  if(n!=='bajo' || R.riego==='limitado'){
    // 1) Same crop, better month
    let mejor=null;
    for(let m=1;m<=12;m++){ const e=evaluar(c,z,m); if(e.viable && (!mejor || e.agua.deficit<mejor.def)) mejor={m,def:e.agua.deficit}; }
    if(mejor && mejor.m!==estado.mes && mejor.def < r.agua.deficit*0.9)
      tips.push(LG(`📅 <b>Plant in ${M(mejor.m-1)}</b> instead: the shortfall drops from ${A(r.agua.deficit)} to ${A(mejor.def)}.`,
                  `📅 <b>Siembre en ${M(mejor.m-1)}</b>: el faltante baja de ${A(r.agua.deficit)} a ${A(mejor.def)}.`));
    // 2) Thirst-friendlier crops
    const alt = evaluarTodos(z, estado.mes).viables.filter(x=>x.c.id!==c.id && x.aguaPct < r.aguaPct-10).sort((a,b)=>a.aguaPct-b.aguaPct).slice(0,2);
    if(alt.length) tips.push(LG(`🌾 <b>Crops that need less water</b> this season: ${alt.map(x=>`${x.c.emoji} ${nom(x.c)} (rain covers ~${Math.round(100-x.aguaPct)}%)`).join(', ')}.`,
                               `🌾 <b>Cultivos que piden menos agua</b> en esta época: ${alt.map(x=>`${x.c.emoji} ${nom(x.c)} (la lluvia cubre ~${Math.round(100-x.aguaPct)}%)`).join(', ')}.`));
    // 3) Critical month
    tips.push(LG(`⏰ <b>Most critical moment:</b> ${tx(c.critica)} (~${M(mesCritico)}). The biggest shortfall is in ${M(pico.m)} (${A(pico.def)}). ${R.riego==='limitado'?'If water is limited, save it for that moment: it protects yield the most.':'Water stress then cuts yield the most.'}`,
                `⏰ <b>Momento más crítico:</b> ${tx(c.critica)} (~${M(mesCritico)}). El mayor faltante es en ${M(pico.m)} (${A(pico.def)}). ${R.riego==='limitado'?'Si el agua es limitada, guárdela para ese momento: es cuando más protege el rendimiento.':'El estrés por agua en ese momento es el que más baja el rendimiento.'}`));
    // 4) Irrigation system efficiency
    if(r.agua.deficit>0) tips.push(LG(`🚿 <b>To supply the missing ${A(r.agua.deficit)}</b> you would need to pump about: ${EFIC.map(s=>`${tx(s.n)} ${A(r.agua.deficit/s.e)} (${VOL(r.agua.deficit/s.e, estado.areaHa)} for the whole field)`).join(' · ')}. Part of the water is lost to evaporation and runoff.`,
                                     `🚿 <b>Para poner los ${A(r.agua.deficit)} que faltan</b> tendría que bombear aprox.: ${EFIC.map(s=>`${tx(s.n)} ${A(r.agua.deficit/s.e)} (${VOL(r.agua.deficit/s.e, estado.areaHa)} en todo el lote)`).join(' · ')}. Parte del agua se pierde por evaporación y escorrentía.`));
    // 5) Keep water in the soil
    tips.push(LG('🍂 <b>Keep crop residue on the surface (no-till):</b> it shades the soil, cuts evaporation and lets more rain soak in.',
                '🍂 <b>Deje el rastrojo sobre el suelo (labranza cero):</b> lo sombrea, reduce la evaporación y deja que entre más lluvia.'));
    if(R.riego!=='si' && r.aguaPct>35) tips.push(LG('🌱 <b>Ask your seed dealer for a drought-tolerant variety</b> and consider a lower plant density: fewer plants share the same water.',
                                                   '🌱 <b>Pida una variedad tolerante a sequía</b> y considere menor densidad de siembra: menos plantas se reparten la misma agua.'));
  }
  if(R.riego==='si' && r.agua.deficit>0){
    tips.push(LG(`📋 <b>Irrigation plan (approx. net water per month, whole field):</b> ${r.agua.filas.filter(f=>f.def>0).map(f=>`${M(f.m)} ${A(f.def)} = ${VOL(f.def, estado.areaHa)}`).join(' · ')}.`,
                `📋 <b>Plan de riego (agua neta aprox. por mes, todo el lote):</b> ${r.agua.filas.filter(f=>f.def>0).map(f=>`${M(f.m)} ${A(f.def)} = ${VOL(f.def, estado.areaHa)}`).join(' · ')}.`));
    tips.push(LG('🌙 Irrigate at night or early morning: less water evaporates before it reaches the roots.','🌙 Riegue de noche o temprano en la mañana: se evapora menos agua antes de llegar a las raíces.'));
  }
  if(z.anomalia.lluvia < -10) tips.push(TR(`📡 This year is ${Math.abs(z.anomalia.lluvia)}% drier than normal: before planting, dig a hole about 6 inches deep and squeeze the soil — if it crumbles, it is too dry.`,
                                          `📡 Este año viene ${Math.abs(z.anomalia.lluvia)}% más seco de lo normal: antes de sembrar, haga un hueco de unos 15 cm y apriete la tierra; si se desmorona, está muy seca.`,
                                          `📡 90-day rain anomaly ${z.anomalia.lluvia}%${z.anomalia.humedadSMAP!=null?` and SMAP soil moisture ${z.anomalia.humedadSMAP}%`:''}: verify with a soil probe before planting (see ⋮ details).`,
                                          `📡 Anomalía de lluvia a 90 días ${z.anomalia.lluvia}%${z.anomalia.humedadSMAP!=null?` y humedad SMAP ${z.anomalia.humedadSMAP}%`:''}: verifique con sonda antes de sembrar (ver detalle ⋮).`));
  if(z.etReal && ING()) tips.push(LG('🛰 OpenET actual ET of this field (30 m) is plotted against Kc·ET₀ in the ⋮ details: a summer gap means past water stress.','🛰 La ET real de OpenET de este lote (30 m) está graficada contra Kc·ET₀ en el detalle ⋮: una brecha en verano indica estrés hídrico pasado.'));
  return tips;
}

function calcularResultados(){
  const z = Z(), c = C(estado.cultivo), R = estado.resp;
  const r = evaluar(c, z, estado.mes);
  const out = [], gaps = [], riesgos = [];
  const viablesMes = evaluarTodos(z, estado.mes).viables;

  // WATER
  { const pct = Math.round(r.aguaPct), d = A(r.agua.deficit); let n, t;
    if(R.riego==='si'){ n='bajo'; t = pct>5 ? LG(`You will need to irrigate about <b>${d}</b> this season. You said you have enough irrigation.`,`Necesitará regar unos <b>${d}</b> en la temporada. Usted dice que tiene riego suficiente.`) : LG('Rain covers what the crop needs.','La lluvia cubre lo que necesita el cultivo.'); }
    else if(R.riego==='limitado'){ n = pct>30?'alto':pct>10?'medio':'bajo';
      t = LG(`You would be short <b>${d}</b> (${pct}% of what the crop needs). With limited irrigation, ${n==='alto'?'it probably will not be enough':'you should be able to cover it'}.`,
            `Le faltarían <b>${d}</b> (${pct}% de lo que pide el cultivo). Con riego limitado, ${n==='alto'?'probablemente no alcance':'debería poder cubrirlo'}.`); }
    else { n = pct>35?'alto':pct>15?'medio':'bajo';
      t = pct>15 ? LG(`Without irrigation you would be short <b>${d}</b> (${pct}% of what it needs). Yield may drop.`,`Sin riego le faltarían <b>${d}</b> (${pct}% de lo que pide). Puede perder rendimiento.`) : LG('Rain should be enough.','La lluvia debería alcanzar.');
      if(R.riego==='nose') gaps.push(LG("We don't know if you have irrigation: we assumed you don't.",'No sabemos si tiene riego: asumimos que no.')); }
    if(z.riego && z.riego.probable && R.riego==='no') gaps.push(TR('Satellites suggest this field is irrigated, but you said it is not: worth double-checking.','El satélite sugiere que el lote tiene riego, pero usted dijo que no: conviene revisarlo.','Water balance (actual ET − rain) suggests irrigation, but the user said no: check for shallow groundwater or sub-irrigation.','El balance hídrico (ET real − lluvia) sugiere riego, pero el usuario dijo que no: revisar nivel freático alto o subirrigación.'));
    if(z.riego && z.riego.probable===false && (R.riego==='si'||R.riego==='limitado')) gaps.push(LG('You said you irrigate, but summer water use looks like rain only: maybe irrigation is small or recent.','Usted dijo que riega, pero el uso de agua en verano parece solo de lluvia: quizás el riego es poco o reciente.'));
    if(z.anomalia.lluvia<0) t += LG(` Note: this year is ${Math.abs(z.anomalia.lluvia)}% drier than normal.`,` Ojo: este año viene ${Math.abs(z.anomalia.lluvia)}% más seco de lo normal.`);
    if(r.agua.deficit>0) t += LG(` For your ${AREA(estado.areaHa)} that is about <b>${VOL(r.agua.deficit, estado.areaHa, true)}</b> of water (net).`,` Para sus ${AREA(estado.areaHa)} son unos <b>${VOL(r.agua.deficit, estado.areaHa, true)}</b> de agua (neta).`);
    out.push({k:'agua', e:'💧', tit:LG('Water','Agua'), n, t, det:'agua', tips:consejosAgua(r,z,R,n)});
    if(n==='alto') riesgos.push(LG('Real availability of irrigation water (well, water rights)','Disponibilidad real de agua para riego (pozo, derechos de agua)')); }

  // CLIMATE
  { let n='bajo', t=LG('Season temperatures are within what the crop tolerates.','La temperatura de la temporada está dentro de lo que tolera el cultivo.'), tips=[];
    if(!r.viable){ n='alto'; t = r.razones.join('. ')+'.';
      const buenos = MES[LANG].filter((_,i)=>evaluar(c,z,i+1).viable);
      if(buenos.length) tips.push(LG(`📅 Better planting months here: <b>${buenos.join(', ')}</b>.`,`📅 Mejores meses para sembrar aquí: <b>${buenos.join(', ')}</b>.`)); }
    else {
      const occ = mesesOcupados(c, estado.mes);
      if(!c.helada && [occ[0],occ[occ.length-1]].some(m=>z.clima.tmin[m]<3)){ n='medio';
        t=LG('Early or late frosts are possible at the start or end of the cycle.','Posibles heladas tempranas o tardías al inicio o al final del ciclo.');
        tips.push(LG('❄️ Plant 2–3 weeks later, or use a shorter-season variety so harvest finishes before the first frost.','❄️ Siembre 2–3 semanas después, o use una variedad de ciclo más corto para cosechar antes de la primera helada.')); }
      if(r.avisos.length){ n='medio'; t = r.avisos.join('. ')+LG('. It can hurt flowering.','. Puede afectar la floración.');
        tips.push(LG(`🌡 Plant earlier so ${tx(c.critica)} does not fall in ${M(r.mesCalor)}, the hottest month.`,`🌡 Siembre antes para que ${tx(c.critica)} no caiga en ${M(r.mesCalor)}, el mes más caliente.`)); }
      // ECOSTRESS: the SURFACE (soil + leaves) can be much hotter than the air that weather stations measure
      const occV = mesesOcupados(c, estado.mes).filter(m=>VERANO.includes(m));
      if(z.lst && occV.length && z.lst.verano > c.tMax){
        if(n==='bajo') n='medio';
        t += TR(` In summer the ground and leaves in your field get as hot as ~${T(z.lst.verano)} (up to ${T(z.lst.max)}), more than ${nom(c).toLowerCase()} likes (~${T(c.tMax)}).`,
                ` En verano el suelo y las hojas de su lote llegan a ~${T(z.lst.verano)} (hasta ${T(z.lst.max)}), más de lo que aguanta el ${nom(c).toLowerCase()} (~${T(c.tMax)}).`,
                ` ECOSTRESS LST (70 m, ${z.lst.n} daytime passes): summer mean ${T(z.lst.verano)}, P90 ${T(z.lst.max)} > crop Tmax ~${T(c.tMax)}.`,
                ` ECOSTRESS LST (70 m, ${z.lst.n} pasadas diurnas): media de verano ${T(z.lst.verano)}, P90 ${T(z.lst.max)} > Tmax del cultivo ~${T(c.tMax)}.`);
        tips.push(LG('🍂 Keep residue on the surface and avoid bare rows in summer: covered soil can be 10–20 °F cooler at midday.','🍂 Mantenga rastrojo sobre el suelo y evite surcos desnudos en verano: el suelo cubierto puede estar 5–10 °C más fresco al mediodía.'));
        if(R.riego==='si'||R.riego==='limitado') tips.push(LG('💧 Irrigating before hot spells cools the canopy (plants "sweat" through transpiration).','💧 Regar antes de las olas de calor refresca el cultivo (las plantas "sudan" al transpirar).'));
      }
    }
    out.push({k:'clima', e:'🌡', tit:LG('Climate (frost and heat)','Clima (helada y calor)'), n, t, det:'clima', tips}); }

  // PESTS — without information we never say "all good": we say "check as a precaution"
  { const prev = C(R.anterior), pl = R.plagas || [];
    const anteriorConocido = !!prev || R.anterior==='descanso';
    const plagasConocidas  = pl.length>0 && !pl.includes('nose');
    const rep = pl.filter(p=>p!=='ninguno' && p!=='nose');
    const repTxt = rep.map(p=>p==='hongos'?LG('leaf fungus','hongos en hojas'):tx(c.plagas[+p.slice(1)])).join(', ');
    let n, t='', tips=[];
    if(prev && prev.id===c.id){ n='alto'; t=LG(`Planting <b>${nom(c)}</b> again in a row: pests and diseases left in the soil and residue attack again.`,`Sembrar <b>${nom(c)}</b> otra vez seguido: las plagas y enfermedades que quedaron en el suelo y el rastrojo vuelven a atacar.`); }
    else if(prev && prev.fam===c.fam){ n='medio'; t=LG(`The previous crop (${nom(prev)}) is from the same family (${famNom(c.fam)}): they share many pests.`,`El cultivo anterior (${nom(prev)}) es de la misma familia (${famNom(c.fam)}): comparten muchas plagas.`); }
    if(rep.length){ n='alto'; t += LG(` You reported: ${repTxt}.`,` Usted reportó: ${repTxt}.`); }
    if(!n){
      if(anteriorConocido && plagasConocidas){ n='bajo'; t=LG('With what you told us (previous crop and pests seen), there are no signs of high risk.','Con lo que nos contó (cultivo anterior y plagas vistas) no hay señales de riesgo alto.'); }
      else { n='revisar';
        t = LG(`We don't have enough information to assess pests${!anteriorConocido?" (we don't know the previous crop)":''}${!plagasConocidas?" (we don't know which pests you've had)":''}. As a precaution, scout your field before planting. The most common pests of ${nom(c).toLowerCase()} are: <b>${c.plagas.map(tx).join(', ')}</b>.`,
              `No tenemos suficiente información para evaluar plagas${!anteriorConocido?' (no sabemos el cultivo anterior)':''}${!plagasConocidas?' (no sabemos qué plagas ha tenido)':''}. Por precaución, revise su lote antes de sembrar. Las plagas más comunes del ${nom(c).toLowerCase()} son: <b>${c.plagas.map(tx).join(', ')}</b>.`); }
    }
    if(prev && prev.fijaN && !c.fijaN) t += LG(` 👍 Coming after a legume (${nom(prev)}): it uses the nitrogen it left.`,` 👍 Viene de una leguminosa (${nom(prev)}): aprovecha el nitrógeno que dejó.`);
    if(n==='alto' || n==='medio'){
      const otra = viablesMes.find(x=>x.c.fam!==c.fam && (!prev || x.c.fam!==prev.fam));
      if(otra) tips.push(LG(`🔄 Rotate to a different family to break the cycle, e.g. ${otra.c.emoji} ${nom(otra.c)} (${famNom(otra.c.fam)}).`,`🔄 Rote a otra familia para cortar el ciclo, p. ej. ${otra.c.emoji} ${nom(otra.c)} (${famNom(otra.c.fam)}).`));
    }
    if(n!=='bajo') tips.push(LG(`🔍 Walk the field and look for ${tx(c.plagas[0]).toLowerCase()}; your county Extension office can confirm what you find.`,`🔍 Recorra el lote buscando ${tx(c.plagas[0]).toLowerCase()}; la oficina de extensión de su condado puede confirmar lo que encuentre.`));
    if(!anteriorConocido) gaps.push(LG("We don't know the previous crop: we can't tell if pests carry over.",'No sabemos el cultivo anterior: no podemos saber si repite plagas.'));
    if(!plagasConocidas) gaps.push(LG("We don't know which pests you've had in the field.",'No sabemos qué plagas ha tenido en el lote.'));
    out.push({k:'plagas', e:'🐛', tit:LG('Pests and diseases','Plagas y enfermedades'), n, t, det:'plagas', tips});
    if(n==='alto') riesgos.push(LG('Pest management plan with an agronomist','Plan de manejo de plagas con un agrónomo'));
    if(n==='revisar') riesgos.push(LG(`Scout the field for ${tx(c.plagas[0]).toLowerCase()} before planting`,`Inspeccionar el lote buscando ${tx(c.plagas[0]).toLowerCase()} antes de sembrar`)); }

  // SOIL AND EROSION
  { let pts=0; const s=z.suelo, notas=[], tips=[];
    if(s.pendiente>6) pts+=2; else if(s.pendiente>2) pts+=1;
    if(/silt/i.test(s.textura||'')){ pts+=1; notas.push(LG('silty soil washes away easily','el suelo limoso se lava fácil')); }
    if(c.erosion==='alta'){ pts+=1; notas.push(LG('it is a row crop that leaves soil bare','es un cultivo en surcos que deja el suelo descubierto')); }
    if(c.erosion==='baja') pts-=1;
    if(R.erosion==='surcos') pts+=1; if(R.erosion==='carcavas') pts+=2;
    if(/[CD]/.test(s.grupoHidro||'')) pts+=1;            // 'B/D' etc. = dual group: counts if it can behave as C/D
    if(R.desnudo==='si' && mesesDesnudo(z).some(m=>!mesesOcupados(c,estado.mes).includes(m) && z.clima.lluvia[m]>=80)) pts+=1;   // bare soil under heavy rain
    const n = pts>=4?'alto':pts>=2?'medio':'bajo';
    const nivelTxt = {bajo:LG('low','bajo'),medio:LG('medium','medio'),alto:LG('high','alto')}[n];
    let t = s.pendiente==null ? LG(`Slope unknown. Erosion risk ${nivelTxt}${notas.length?': '+notas.join(' and '):''}.`,`Pendiente desconocida. Riesgo de erosión ${nivelTxt}${notas.length?': '+notas.join(' y '):''}.`)
          : s.pendiente < 2 ? LG(`Your field is flat (slope ~${s.pendiente}%): rain washes little soil away. Erosion risk ${nivelTxt}${notas.length?': '+notas.join(' and '):''}.`,`Su lote es plano (pendiente ~${s.pendiente}%): la lluvia se lleva poca tierra. Riesgo de erosión ${nivelTxt}${notas.length?': '+notas.join(' y '):''}.`)
                                 : LG(`Slope ~${s.pendiente}%. Erosion risk ${nivelTxt}${notas.length?': '+notas.join(' and '):''}.`,`Pendiente ~${s.pendiente}%. Riesgo de erosión ${nivelTxt}${notas.length?': '+notas.join(' y '):''}.`);
    if(R.encharca==='si'){ t += LG(' The field ponds: careful with crops sensitive to waterlogged roots.',' El lote se encharca: cuidado con cultivos sensibles a raíces ahogadas.');
      tips.push(LG('🌊 Improve drainage in the low spots (tile or surface drains) before planting.','🌊 Mejore el drenaje de las partes bajas (drenes) antes de sembrar.')); }
    if(!s.textura && R.suelo && R.suelo!=='nose') t += LG(` You described your soil as ${{arenoso:'sandy',si:'loam',arcilloso:'clayey'}[R.suelo]} (the USDA soil map did not answer).`,` Usted describió su suelo como ${{arenoso:'arenoso',si:'franco',arcilloso:'arcilloso'}[R.suelo]} (el mapa de suelos del USDA no respondió).`);
    else if(R.suelo && R.suelo!=='si' && R.suelo!=='nose') t += LG(` You see the soil as ${R.suelo==='arenoso'?'sandier':'more clayey'} than the map: we trust you, but a soil test is a good idea.`,` Usted ve el suelo ${R.suelo==='arenoso'?'más arenoso':'más arcilloso'} que el mapa: confiamos en usted, pero conviene un análisis de suelo.`);
    if(R.suelo==='nose') gaps.push(TR("You didn't confirm the soil type: we used the soil map.",'No confirmó el tipo de suelo: usamos el mapa de suelos.',"Soil type not confirmed: SSURGO dominant component used.",'Tipo de suelo sin confirmar: se usó el componente dominante de SSURGO.'));
    if(c.suelo>=2) t += LG(` 👍 ${nom(c)} helps improve the soil.`,` 👍 ${nom(c)} ayuda a mejorar el suelo.`);
    // Bare months (Sentinel-2 NDVI, confirmed by the farmer): which ones the new crop covers, which stay bare
    const desn = (R.desnudo==='si') ? mesesDesnudo(z) : [];
    const occS = mesesOcupados(c, estado.mes);
    const cubre = desn.filter(m=>occS.includes(m)), libres = desn.filter(m=>!occS.includes(m));
    if(cubre.length) t += LG(` 👍 It covers the soil in ${listaMeses(cubre)}, months your field is usually bare.`,` 👍 Cubre el suelo en ${listaMeses(cubre)}, meses en que su lote suele estar desnudo.`);
    if(libres.length){
      const lluviosos = libres.filter(m=>z.clima.lluvia[m]>=80);
      if(lluviosos.length){ t += LG(` The soil would stay bare in rainy months (${listaMeses(lluviosos)}).`,` El suelo quedaría desnudo en meses lluviosos (${listaMeses(lluviosos)}).`); }
      tips.push(LG(`🌿 After harvest your field would still be bare in <b>${listaMeses(libres)}</b>: plant a cover crop then (e.g. cereal rye, or clover to add nitrogen). It holds the soil and adds organic matter.`,
                   `🌿 Después de la cosecha su lote seguiría desnudo en <b>${listaMeses(libres)}</b>: siembre un cultivo de cobertura en esos meses (p. ej. centeno, o trébol para aportar nitrógeno). Sujeta el suelo y aporta materia orgánica.`));
    }
    if(R.desnudo==='nose') gaps.push(TR("You didn't confirm the bare months: we used the satellite photos.",'No confirmó los meses desnudos: usamos las fotos de satélite.',"Bare months not confirmed: Sentinel-2 NDVI used.",'Meses desnudos sin confirmar: se usó el NDVI de Sentinel-2.'));
    if(n!=='bajo'){
      if(!libres.length) tips.push(LG('🌿 After harvest, plant a cover crop (e.g. cereal rye) so the soil is never bare over winter.','🌿 Después de la cosecha siembre un cultivo de cobertura (p. ej. centeno) para que el suelo no quede desnudo en invierno.'));
      if(s.pendiente>2) tips.push(LG('↔️ Plant across the slope (contour farming) so rows slow the water down.','↔️ Siembre en contorno, atravesado a la pendiente, para que los surcos frenen el agua.'));
    }
    out.push({k:'suelo', e:'🟫', tit:LG('Soil and erosion','Suelo y erosión'), n, t, det:'suelo', tips}); }

  // NITROGEN AND pH — how moisture and organic matter decide whether the soil's nitrogen reaches the roots
  { const s = z.suelo, tips = [], r = evaluar(c, z, estado.mes); let n = 'bajo', t = '';
    const N = s.n_gkg, SOC = s.soc_gkg, ph = s.ph;
    const nNivel = N==null ? null : N < 1 ? 'bajo' : N < 2 ? 'medio' : 'alto', est = !!s.quimicaEstimada;
    // moisture state: real SMAP if available; otherwise what the farmer and the soil map tell us (we never invent a % value)
    const sm = z.smap ? z.smap.actual : null;
    const humedo = (sm!=null && sm > 0.34) || R.encharca==='si' || /poorly/i.test(s.drenaje||'');
    const seco = sm!=null && sm < 0.16;
    if(N==null && ph==null){ n='revisar';
      t = TR("We couldn't get your soil's nitrogen and pH from the soil maps. A basic soil test tells you how much fertilizer to buy.",
             'No pudimos obtener el nitrógeno y el pH de su suelo en los mapas de suelos. Un análisis de suelo básico le dice cuánto fertilizante comprar.',
             'SoilGrids and SSURGO did not return N / SOC / pH for this point.','SoilGrids y SSURGO no devolvieron N / COS / pH para este punto.');
      gaps.push(LG("We don't know your soil's nitrogen or pH.",'No sabemos el nitrógeno ni el pH de su suelo.'));
    } else {
      if(N!=null) t += (est && !ING() ? LG('By its organic matter, ','Por su materia orgánica, ') : '') + TR(`Your soil has a <b>${{bajo:'low',medio:'medium',alto:'good'}[nNivel]}</b> natural nitrogen reserve`,
                          `Su suelo tiene una reserva natural de nitrógeno <b>${{bajo:'baja',medio:'media',alto:'buena'}[nNivel]}</b>`,
                          est ? `Total N ≈ <b>${N.toFixed(2)} g/kg</b> (${{bajo:'low',medio:'medium',alto:'high'}[nNivel]}), estimated from SSURGO organic matter ${s.mo}% (SOC = OM × 0.58 = ${SOC} g/kg; C:N assumed 11; SoilGrids unavailable)` : `Total N (0–5 cm) <b>${N.toFixed(2)} g/kg</b> (${{bajo:'low',medio:'medium',alto:'high'}[nNivel]})${SOC!=null?`, SOC ${SOC.toFixed(1)} g/kg, C:N ≈ ${(SOC/N).toFixed(0)}`:''}`,
                          est ? `N total ≈ <b>${N.toFixed(2)} g/kg</b> (${{bajo:'bajo',medio:'medio',alto:'alto'}[nNivel]}), estimado con la materia orgánica de SSURGO ${s.mo}% (COS = MO × 0,58 = ${SOC} g/kg; C:N supuesto 11; SoilGrids no disponible)` : `N total (0–5 cm) <b>${N.toFixed(2)} g/kg</b> (${{bajo:'bajo',medio:'medio',alto:'alto'}[nNivel]})${SOC!=null?`, COS ${SOC.toFixed(1)} g/kg, C:N ≈ ${(SOC/N).toFixed(0)}`:''}`)
                + (SOC!=null && !ING() ? LG(SOC>=20?' and plenty of organic matter (dark soil).':' and little organic matter (light soil).', SOC>=20?' y bastante materia orgánica (suelo oscuro).':' y poca materia orgánica (suelo claro).') : '.');
      t = t.replace(/^(By its organic matter, |Por su materia orgánica, )(.)/, (m,a,b)=>a+b.toLowerCase());
      if(sm!=null) t += TR(` Today the topsoil is ${seco?'dry':humedo?'very wet':'moist'} (satellite).`,` Hoy la capa de arriba está ${seco?'seca':humedo?'muy húmeda':'húmeda'} (satélite).`,
                           ` SMAP surface moisture (last 30 d): ${(sm*100).toFixed(0)} % vol.`,` Humedad superficial SMAP (últimos 30 d): ${(sm*100).toFixed(0)} % vol.`);
      // the "why": soil bacteria turn organic N into nitrate only with water AND air in the pores
      if(N!=null && !c.fijaN){
        if(humedo){ n='medio';
          const porQue = (sm!=null && sm > 0.34) ? LG('the satellite sees the soil very wet','el satélite ve el suelo muy húmedo') : R.encharca==='si' ? LG('you told us it ponds','usted nos dijo que se encharca') : LG('the soil map says it drains slowly','el mapa de suelos dice que drena lento');
          t += TR(` Your field holds a lot of water (${porQue}): nitrogen fertilizer can wash down below the roots or escape to the air.`,` Su lote retiene mucha agua (${porQue}): el fertilizante nitrogenado se puede lavar por debajo de las raíces o escaparse al aire.`,
                  ' Saturated pores: risk of nitrate leaching and denitrification (NO₃⁻ → N₂O/N₂).',' Poros saturados: riesgo de lixiviación de nitratos y desnitrificación (NO₃⁻ → N₂O/N₂).');
          tips.push(LG('⏱ Split the nitrogen into 2–3 smaller applications instead of one big one, so the crop uses it before water carries it away.','⏱ Divida el nitrógeno en 2–3 aplicaciones pequeñas en lugar de una grande, para que el cultivo lo use antes de que el agua se lo lleve.'));
        } else if(seco){
          t += TR(' With dry soil, fertilizer left on top does not reach the roots.',' Con el suelo seco, el fertilizante que queda encima no llega a las raíces.',
                  ' Dry topsoil: little mass flow of nitrate to the roots, slow mineralization.',' Suelo superficial seco: poco flujo de masas de nitrato hacia la raíz y mineralización lenta.');
          tips.push(LG('💧 Work the fertilizer into the soil or apply it right before rain or irrigation.','💧 Incorpore el fertilizante al suelo o aplíquelo justo antes de una lluvia o un riego.'));
        } else if(nNivel==='alto'){
          t += TR(' Moisture is right for soil life to release that nitrogen to the crop: you may need less fertilizer.',' La humedad es la adecuada para que la vida del suelo le entregue ese nitrógeno al cultivo: podría necesitar menos fertilizante.',
                  ' Moist, aerated soil + high N reserve: good conditions for mineralization (organic N → NH₄⁺ → NO₃⁻).',' Suelo húmedo y aireado + reserva alta de N: buenas condiciones de mineralización (N orgánico → NH₄⁺ → NO₃⁻).');
        }
        if(nNivel==='bajo'){ if(n==='bajo') n='medio';
          tips.push(LG(`🧪 ${nom(c)} will need nitrogen fertilizer: ask your Extension lab for a soil test to know the dose. Next season, a legume (soybeans, alfalfa) before it leaves nitrogen for free.`,`🧪 El ${nom(c).toLowerCase()} va a necesitar fertilizante nitrogenado: pida un análisis de suelo en el laboratorio de extensión para saber la dosis. La próxima temporada, una leguminosa antes (soya, alfalfa) le deja nitrógeno gratis.`)); }
        if(ING() && !est && SOC!=null && SOC/N > 20) tips.push(LG('🍂 C:N > 20: microbes lock up nitrogen while they break down residue; add some N at planting.','🍂 C:N > 20: los microbios retienen nitrógeno mientras descomponen el rastrojo; aplique algo de N en la siembra.'));
      }
      if(c.fijaN){ t += LG(` 👍 ${nom(c)} is a legume: it makes its own nitrogen from the air.`,` 👍 ${nom(c)} es leguminosa: produce su propio nitrógeno a partir del aire.`);
        tips.push(LG('🦠 Inoculate the seed with the right rhizobium if this crop has not grown in the field in the last few years.','🦠 Inocule la semilla con el rizobio adecuado si este cultivo no se ha sembrado en el lote en los últimos años.')); }
      // pH
      if(ph!=null){
        t += TR(` Soil pH ${ph.toFixed(1)} (${nom(c).toLowerCase()} likes ${c.ph[0]}–${c.ph[1]}).`,` pH del suelo ${ph.toFixed(1)} (el ${nom(c).toLowerCase()} prefiere ${c.ph[0]}–${c.ph[1]}).`,
                ` pH ${ph.toFixed(1)} (${s.phFuente||'SSURGO'}); crop range ${c.ph[0]}–${c.ph[1]}.`,` pH ${ph.toFixed(1)} (${s.phFuente||'SSURGO'}); rango del cultivo ${c.ph[0]}–${c.ph[1]}.`);
        if(r.phFuera==='acido'){ n = n==='alto'?n:'medio'; tips.push(LG('🪨 Apply agricultural lime (the soil test gives the amount) a few months before planting: it raises pH and frees phosphorus.','🪨 Aplique cal agrícola (el análisis de suelo da la cantidad) unos meses antes de sembrar: sube el pH y libera el fósforo.')); }
        if(r.phFuera==='alcalino'){ n = n==='alto'?n:'medio'; tips.push(LG('🟡 Alkaline soil locks up iron and zinc (yellow leaves): choose tolerant varieties and use acidifying fertilizers (e.g. ammonium sulfate) or elemental sulfur.','🟡 El suelo alcalino bloquea el hierro y el zinc (hojas amarillas): elija variedades tolerantes y use fertilizantes acidificantes (p. ej. sulfato de amonio) o azufre elemental.')); }
      } else gaps.push(LG("We don't know your soil pH.",'No sabemos el pH de su suelo.'));
      if(N==null) gaps.push(LG("We don't know your soil's nitrogen reserve.",'No sabemos la reserva de nitrógeno de su suelo.'));
      riesgos.push(LG('Confirm nitrogen and pH with a lab soil test before buying fertilizer (maps are 250 m averages, not your field)','Confirme nitrógeno y pH con un análisis de suelo de laboratorio antes de comprar fertilizante (los mapas son promedios de 250 m, no su lote)'));
    }
    out.push({k:'nutrientes', e:'🧪', tit:LG('Nitrogen and soil pH','Nitrógeno y pH del suelo'), n, t, det:'suelo', tips}); }

  // MARKET
  { let n='bajo', tips=[];
    let t = r.ingreso ? LG(`For your ${AREA(estado.areaHa)}: harvest of about <b>${PROD(r.rend*estado.areaHa)}</b> and gross income of about <b>${USD(r.ingreso*estado.areaHa)}</b> (${HA(r.ingreso)}: ${REND(r.rend)} × $${fmt(precioDe(c))}/t).`,
                            `Para sus ${AREA(estado.areaHa)}: cosecha de unas <b>${PROD(r.rend*estado.areaHa)}</b> e ingreso bruto de unos <b>${USD(r.ingreso*estado.areaHa)}</b> (${HA(r.ingreso)}: ${REND(r.rend)} × $${fmt(precioDe(c))}/t).`)
                      : TR(`We don't have harvest data for ${nom(c).toLowerCase()} in your county, so we can't estimate income.`,`No tenemos datos de cosecha de ${nom(c).toLowerCase()} en su condado, así que no podemos estimar el ingreso.`,`No historical yield for ${nom(c).toLowerCase()} in your county (NASS): we can't estimate income.`,`No hay rendimiento histórico de ${nom(c).toLowerCase()} en su condado (NASS): no podemos estimar el ingreso.`);
    if(r.ingreso && (z.rendEEUU || (z.rendEEUUCult||[]).includes(c.id))){ t += z.rendEEUU
      ? TR(' <i>Yield is a U.S. average (no county data yet).</i>',' <i>El rendimiento es un promedio de EE. UU. (aún sin datos del condado).</i>',' <i>Yield = approx. U.S. average (run the backend with NASS_API_KEY for county yields).</i>',' <i>Rendimiento = promedio aprox. de EE. UU. (ejecute el backend con NASS_API_KEY para rendimiento del condado).</i>')
      : TR(` <i>Your county and state have no recent harvest records for ${nom(c).toLowerCase()}: we used the U.S. average.</i>`,` <i>Su condado y su estado no tienen registros recientes de cosecha de ${nom(c).toLowerCase()}: usamos el promedio de EE. UU.</i>`,` <i>NASS has no county/state yield for ${nom(c).toLowerCase()} in the last 5 years: U.S. average used.</i>`,` <i>NASS no tiene rendimiento de condado/estado de ${nom(c).toLowerCase()} en los últimos 5 años: se usó el promedio de EE. UU.</i>`); }
    if(!r.ingreso){ n='medio'; gaps.push(TR('No harvest data for this crop in your area.','Sin datos de cosecha de este cultivo en la zona.','No NASS yield for this crop in your area.','Sin rendimiento NASS para este cultivo en la zona.')); }
    t += LG(" <i>The price is today's; you will sell at harvest.</i>"," <i>El precio es el de hoy; usted venderá en la cosecha.</i>");
    tips.push(TR('📈 Prices change every week: consider selling part of the harvest ahead with a contract to lock in a price.','📈 Los precios cambian cada semana: considere vender parte de la cosecha por adelantado con un contrato para asegurar un precio.',
                 '📈 Check the 12-month NASS price trend in the ⋮ details and consider forward-contracting part of the harvest.','📈 Revise la tendencia de 12 meses del precio NASS en el detalle ⋮ y considere un contrato a futuro para parte de la cosecha.'));
    out.push({k:'mercado', e:'💵', tit:LG('Market and income','Mercado e ingreso'), n, t, det:'mercado', tips}); }

  // Data sources that failed (only with real backend data)
  if(z.demo) gaps.push(TR('This is a demo: prices and weather are example values.','Esta es una demostración: los precios y el clima son valores de ejemplo.','Demo mode: prices and climate are approximate values (run the backend for live data).','Modo demo: precios y clima son valores aproximados (ejecute el backend para datos reales).'));
  else if(z.fuentes && !ING()){ if(Object.entries(z.fuentes).some(([k,v])=>!['ok','sin_clave','solo_capas','sin_estaciones','capa_albedo','lejos','sin_datos'].includes(v))) gaps.push(LG('Some data could not be downloaded right now; those parts use averages and your answers.','Algunos datos no se pudieron descargar ahora; esas partes usan promedios y sus respuestas.')); }
  riesgos.push(LG('Validate this recommendation with your county Extension office','Validar la recomendación con la oficina de extensión del condado'));
  return {r, out, gaps, riesgos, fuentesInfo: z.demo ? null : estadoFuentes(z)};
}

const ESTADO_FUENTE = {clave_rechazada:{en:'API key rejected or out of credits',es:'clave rechazada o sin créditos'}, sin_respuesta:{en:'no response (network/CORS)',es:'sin respuesta (red/CORS)'}, lejos:{en:'no AppEEARS point within 150 km',es:'sin punto AppEEARS a menos de 150 km'}, capa_albedo:{en:'AppEEARS layer is albedo, not moisture',es:'la capa de AppEEARS es albedo, no humedad'}, sin_clave:{en:'no API key configured',es:'sin clave de API'}, solo_capas:{en:'map layers only',es:'solo capas de mapa'}, sin_datos:{en:'no data here',es:'sin datos aquí'}, sin_estaciones:{en:'no stations nearby',es:'sin estaciones cerca'},
  datos_incompletos:{en:'incomplete data',es:'datos incompletos'}, error:{en:'service error',es:'error del servicio'}, parcial:{en:'partial',es:'parcial'}};
const estadoF = v => tx(ESTADO_FUENTE[v]) || v;
// What replaces each source when it is missing (null = nothing replaces it) and which key turns it on
const RESPALDO = {openet:{en:'FAO-56 Penman-Monteith with NASA POWER',es:'FAO-56 Penman-Monteith con NASA POWER'}, imerg:{en:'NASA POWER + gridMET rain',es:'lluvia NASA POWER + gridMET'},
  smap:null, sentinel:{en:'Copernicus map layers (no monthly NDVI curve)',es:'capas de mapa Copernicus (sin curva mensual de NDVI)'}, srtm:{en:'SSURGO slope',es:'pendiente de SSURGO'},
  ssurgo:{en:'your answer about the soil',es:'su respuesta sobre el suelo'}, soilgrids:{en:'estimate from SSURGO organic matter',es:'estimación con la materia orgánica de SSURGO'},
  cdl:{en:'your answer about the previous crop',es:'su respuesta sobre el cultivo anterior'}, nass:{en:'U.S. average yields and reference prices',es:'rendimientos promedio de EE. UU. y precios de referencia'},
  ams:{en:'NASS or reference prices',es:'precios NASS o de referencia'}, acis:{en:'NASA POWER',es:'NASA POWER'}, scan:null, ecostress:null, appeears:null, power:null};
const CLAVE = {imerg:'EE_PROJECT (Earth Engine)', smap:'EE_PROJECT (Earth Engine)', sentinel:'EE_PROJECT (Earth Engine)', srtm:'EE_PROJECT (Earth Engine)',
  nass:'NASS_API_KEY', ams:'AMS_API_KEY', ecostress:'EARTHDATA_USERNAME / PASSWORD', openet:'OPENET_API_KEY'};
function estadoFuentes(z){
  const f = z.fuentes || {}, nom = k => NOMBRE_FUENTE[k]||k, resp = k => RESPALDO[k] ? tx(RESPALDO[k]) : null;
  const ok = [], opc = [], fallas = [], noAplica = [];
  for(const [k,v] of Object.entries(f)){
    if(v==='ok') ok.push(nom(k));
    else if(['sin_estaciones','lejos','sin_datos'].includes(v)) noAplica.push(`${nom(k)} (${estadoF(v)})`);
    else if(v==='capa_albedo') fallas.push(LG(`SMAP: the AppEEARS export has the albedo layer → request <code>Soil_Moisture_Retrieval_Data_AM_soil_moisture</code> again and copy the CSV into datos/appeears`,`SMAP: el export de AppEEARS trae la capa albedo → pida de nuevo <code>Soil_Moisture_Retrieval_Data_AM_soil_moisture</code> y copie el CSV en datos/appeears`));
    else if(v==='sin_clave') opc.push(`${nom(k)} → ${CLAVE[k]||LG('key','clave')}${resp(k)?LG(` (meanwhile: ${resp(k)})`,` (mientras tanto: ${resp(k)})`):''}`);
    else if(v==='solo_capas') ok.push(nom(k)+LG(' (map layers)',' (capas de mapa)'));
    else fallas.push(`${nom(k)}: ${estadoF(v)} → ${resp(k) ? LG('used ','se usó ')+resp(k) : LG('nothing replaces it','nada lo reemplaza')}`);
  }
  return {ok, opc, fallas, noAplica};
}
const NOMBRE_FUENTE = {appeears:'AppEEARS', ecostress:'ECOSTRESS', power:'NASA POWER', openet:'OpenET', imerg:'GPM-IMERG', smap:'SMAP', sentinel:'Sentinel-2', srtm:'SRTM', ssurgo:'SSURGO', soilgrids:'SoilGrids', cdl:'CDL', nass:'NASS', ams:'AMS', acis:'ACIS/CoCoRaHS', scan:'SCAN'};

/* =====================================================================================
   ROTATION STRATEGIES (the core of the challenge): compare 3 strategies over 3 years,
   including the CURRENT one (USDA CDL history). Built on top of evaluar()/puntuar():
   same climate, water balance, frost and income logic, applied to a crop SEQUENCE.
   ===================================================================================== */
// Typical nitrogen need of each crop (kg N/ha) and the N credit a legume leaves for the next crop.
// WHY: corn after soybean needs ~30–50 lb N/acre less; after alfalfa ~100–150 lb less (U.S. Extension ballpark values).
const N_NECESIDAD = {maiz:170, trigo:100, sorgo:110, algodon:90, girasol:80, avena:70, tomate:150, soya:0, alfalfa:0, garbanzo:0};
const N_CREDITO   = {soya:45, alfalfa:110, garbanzo:30};
const MAIZ_SOBRE_MAIZ = {n:40, rend:0.90};   // corn after corn: +40 kg N/ha and ~10 % less yield ("rotation effect")
const COBERTURA = {id:'cob', n:{en:'Cereal rye cover crop',es:'Cobertura de centeno'}, emoji:'🌱', fam:'poa', kc:0.5};
const MESES_COB_MIN = 3;
// alfalfa is a perennial: in a rotation it holds the field a full year (dormant but covering the soil in winter)
const OCUPA_ROT = {alfalfa:12};
const ocupa = c => OCUPA_ROT[c.id] || c.ciclo;                     // a gap of 3+ months between harvest and planting can hold a cover crop
const NHA = kg => UNI==='met' ? `${fmt(kg)} kg N/ha` : `${fmt(kg*0.892)} lb N/acre`;   // 1 kg/ha = 0.892 lb/acre

// months (1..12) where the crop is viable at this place, best (least irrigation) first
function mesesViables(c, z){
  return c.siembra.map(m => ({m, r:evaluar(c, z, m)})).filter(x => x.r.viable).sort((a,b) => a.r.agua.deficit - b.r.agua.deficit).map(x => x.m);
}

// Place a repeating crop cycle on a 36-month line (Jan of year 1 = month 0)
function colocarRotacion(ciclo, z, conCob, largo = 36){
  const occ = Array(largo).fill(null), pl = [];
  let pos = 0, k = 0, guarda = 0;
  while(pos < largo && guarda++ < 80){
    const id = ciclo[k % ciclo.length]; k++;
    if(id === 'descanso'){ pl.push({c:null, t:pos}); pos += 12; continue; }
    const c = C(id), ok = mesesViables(c, z), meses = ok.length ? ok : c.siembra;
    let t = pos; while(t < pos + 24 && !meses.includes((t % 12) + 1)) t++;
    if(t >= largo) break;
    const mes = (t % 12) + 1, r = evaluar(c, z, mes);
    const ajusteHolgado = pl.length && pl[pl.length-1].c && (t - (pl[pl.length-1].t + ocupa(pl[pl.length-1].c))) === 0;
    pl.push({c, t, mes, r, forzado: !ok.length, pegado: ajusteHolgado});
    for(let i = 0; i < ocupa(c); i++) if(t + i < largo) occ[t + i] = c.id;
    pos = t + ocupa(c);
  }
  // cover crop in every gap of 3+ months that has at least one month mild enough to establish it (3–25 °C average)
  const cob = [];
  if(conCob){
    let i = 0;
    while(i < largo){
      if(occ[i] !== null){ i++; continue; }
      let j = i; while(j < largo && occ[j] === null) j++;
      const hueco = j - i, inicio = [i, i+1].filter(x => x < j).map(x => z.clima.tmed[x % 12]);
      if(hueco >= MESES_COB_MIN && inicio.some(t => t >= 3 && t <= 25)){
        let usoSuelo = 0;
        for(let x = i; x < j; x++){ const m = x % 12; usoSuelo += Math.max(0, COBERTURA.kc*z.clima.et0[m] - 0.75*z.clima.lluvia[m]); occ[x] = 'cob'; }
        cob.push({t:i, largo:hueco, usoSuelo});
      }
      i = j;
    }
  }
  return {pl, occ, cob};
}

// Metrics of one strategy (per year = window / 3)
function medirRotacion(est, z){
  const cul = est.pl.filter(p => p.c), anios = est.occ.length / 12;
  const s = z.suelo || {}, pend = s.pendiente;
  let riego = 0, need = 0, ingreso = 0, ingresoConocido = true, nComprar = 0, mismos = 0, transiciones = 0, maizMaiz = false;
  // steady state: the first crop of the window follows the LAST crop of the cycle (the rotation repeats every year)
  const antesDelPrimero = C(est.ciclo[est.ciclo.length-1]);
  cul.forEach((p, i) => {
    const prev = i ? cul[i-1] : (antesDelPrimero ? {c:antesDelPrimero} : null);
    riego += p.r.agua.deficit; need += p.r.agua.need;
    const mm = !!prev && p.c.id === 'maiz' && prev.c.id === 'maiz';
    if(mm) maizMaiz = true;
    if(p.r.ingreso == null) ingresoConocido = false; else ingreso += p.r.ingreso * (mm ? MAIZ_SOBRE_MAIZ.rend : 1);
    const credito = prev && prev.c.id !== p.c.id ? (N_CREDITO[prev.c.id] || 0) : 0;
    p.nNecesita = (N_NECESIDAD[p.c.id] || 0) + (mm ? MAIZ_SOBRE_MAIZ.n : 0); p.nCredito = Math.min(p.nNecesita, credito);
    nComprar += p.nNecesita - p.nCredito;
  });
  // pest-cycle break measured on the repeating cycle (not on the 36-month window, which cuts it)
  const cic = est.ciclo.map(id => C(id)).filter(Boolean);
  cic.forEach((c, i) => { const a = cic[(i - 1 + cic.length) % cic.length]; transiciones++; if(a.fam === c.fam) mismos++; });
  const desnudo = est.occ.filter(x => x === null).length / anios;              // months per year
  const residuo = cul.length ? cul.reduce((a, p) => a + p.c.suelo, 0) / cul.length + (est.cob.length ? 0.6 : 0) : 0;
  const altaEros = cul.length ? cul.filter(p => p.c.erosion === 'alta').length / cul.length : 0;
  const factorPend = pend == null ? 1 : pend >= 6 ? 1.6 : pend >= 2 ? 1.3 : 1;
  const ruptura = transiciones ? 100 * (1 - mismos / transiciones) : (cul.length ? 0 : 100);
  return {
    riego: riego/anios, need: need/anios, lluviaPct: need ? Math.max(0, 100 - riego/need*100) : 100,
    ingreso: ingresoConocido ? ingreso/anios : null, nComprar: nComprar/anios, desnudo, residuo, ruptura, maizMaiz,
    erosion: Math.min(100, (desnudo/12*70 + altaEros*30) * factorPend),
    forraje: cul.length ? cul.reduce((a, p) => a + p.c.forraje, 0) / cul.length : 0,
    cobSuelo: est.cob.reduce((a, b) => a + b.usoSuelo, 0) / anios, cultivos: cul.length / anios
  };
}

function puntuarRotacion(ests){
  const p = estado.prioridades, wsum = Object.values(p).reduce((a,b)=>a+b, 0) || 1;
  const maxIng = Math.max(1, ...ests.map(e => e.m.ingreso || 0));
  ests.forEach(e => {
    const m = e.m;
    e.sub = { agua: m.lluviaPct, ingreso: m.ingreso != null ? m.ingreso/maxIng*100 : 40,
              suelo: Math.max(0, 100 - m.erosion*0.6 - (3 - Math.min(3, m.residuo))/3*40),
              forraje: m.forraje/3*100, nitrogeno: 100*(1 - Math.min(1, m.nComprar/170)) };
    let tot = 0; for(const k in p) tot += p[k]*e.sub[k];
    const castigo = (e.pl.some(x => x.forzado) ? 15 : 0) + (e.pl.some(x => x.r && x.r.avisos.length) ? 4 : 0);
    e.puntaje = Math.round(Math.max(0, Math.min(100, tot/wsum*0.9 + m.ruptura*0.1 - castigo)));
  });
}

// The farmer's current rotation: CDL (30 m, last 3 years) + their answer about last season
function rotacionActual(z){
  const R = estado.resp, cdl = (z.cdl || []).slice().sort((a,b) => a.anio - b.anio);
  let seq = cdl.map(x => x.cultivo ? x.cultivo : (x.codigo === 61 ? 'descanso' : null)).filter(x => x !== null);
  let origen = seq.length ? 'cdl' : null;
  if(R.anterior && (C(R.anterior) || R.anterior === 'descanso')){
    if(seq.length) seq[seq.length-1] = R.anterior; else { seq = [R.anterior]; origen = 'respuesta'; }
  }
  if(!seq.length){ seq = [estado.cultivo]; origen = 'supuesto'; }
  // reduce to the repeating pattern: [a,a,a] → [a]; [a,b,a] → [a,b]
  let ciclo = seq;
  if(seq.every(x => x === seq[0])) ciclo = [seq[0]];
  else if(seq.length >= 3 && seq.every((x,i) => x === seq[i % 2])) ciclo = [seq[0], seq[1]];
  return {ciclo, origen, anios: cdl.map(x => x.anio)};
}

function candidatosRotacion(z){
  const lista = CULTIVOS.map(c => { const ms = mesesViables(c, z); return ms.length ? evaluar(c, z, ms[0]) : null; }).filter(Boolean);
  lista.forEach(r => puntuar(r, lista));
  return lista.sort((a,b) => b.puntaje - a.puntaje);
}

function construirEstrategias(){
  const z = Z(), cand = candidatosRotacion(z), elegido = C(estado.cultivo);
  const act = rotacionActual(z);
  const ests = [];
  // 1) what they do today
  ests.push({id:'actual', ciclo:act.ciclo, cob:false, origen:act.origen, anios:act.anios});
  // 2) their chosen crop, in rotation with the best partner of another family (+ cover crop)
  const quiereLeg = !elegido.fijaN;
  const socios = cand.filter(r => r.c.fam !== elegido.fam && r.c.id !== elegido.id);
  const socio = (socios.find(r => quiereLeg ? r.c.fijaN : (N_NECESIDAD[r.c.id] > 0)) || socios[0] || {}).c;
  ests.push({id:'elegido', ciclo: socio ? (elegido.fijaN ? [socio.id, elegido.id] : [elegido.id, socio.id]) : [elegido.id], cob:true, socio});
  // 3) diversified for their priorities: 3 families, at least one legume, legume placed before the hungriest crop
  const elegidos = [], fams = new Set();
  const leg = cand.find(r => r.c.fijaN);
  if(leg){ elegidos.push(leg.c); fams.add(leg.c.fam); }
  for(const r of cand){ if(elegidos.length >= 3) break; if(!fams.has(r.c.fam)){ elegidos.push(r.c); fams.add(r.c.fam); } }
  for(const r of cand){ if(elegidos.length >= 3) break; if(!elegidos.includes(r.c)) elegidos.push(r.c); }
  const firma = a => a.slice().sort().join(',');
  if(elegidos.length >= 3 && firma(elegidos.map(c=>c.id)) === firma(ests[1].ciclo)){
    const otro = cand.find(r => !elegidos.includes(r.c) && r.c.fam !== elegidos[2].fam); if(otro) elegidos[2] = otro.c;
  }
  const legs = elegidos.filter(c => c.fijaN), resto = elegidos.filter(c => !c.fijaN).sort((a,b) => N_NECESIDAD[b.id] - N_NECESIDAD[a.id]);
  const orden = [];
  resto.forEach((c, i) => { if(legs[i]) orden.push(legs[i].id); orden.push(c.id); });
  legs.slice(resto.length).forEach(c => orden.push(c.id));
  ests.push({id:'diversa', ciclo: orden.length ? orden : [elegido.id], cob:true});

  // metrics on 10 years of the repeating rotation (steady state, no cut-off bias); the drawing shows the first 3 years
  ests.forEach(e => { const largo = colocarRotacion(e.ciclo, z, e.cob, 120); e.m = medirRotacion({...largo, ciclo:e.ciclo}, z); e.largo = largo; Object.assign(e, colocarRotacion(e.ciclo, z, e.cob, 36)); medirRotacion(e, z); /* fills N need/credit of the 3 drawn years */ });
  puntuarRotacion(ests);
  textosRotacion(ests, z);
  const mejor = ests.reduce((a,b) => b.puntaje > a.puntaje ? b : a);
  mejor.mejor = true;
  return ests;
}

const nomId = id => id === 'descanso' ? LG('fallow','descanso') : (C(id) ? nom(C(id)) : id);
const secuencia = e => e.ciclo.map(id => (C(id) ? C(id).emoji + ' ' : '⬜ ') + nomId(id)).join(' → ') + (e.cob && e.cob.length ? ' + 🌱' : '');

                                                                     `🛰 USDA Cropland Data Layer ${e.anios.join('–')} (30 m): ${(z.cdl||[]).slice().sort((a,b)=>a.anio-b.anio).map(x=>`${x.cultivo?nom(C(x.cultivo)):'?'} (${x.codigo??'-'})`).join(' → ')}`,`🛰 USDA Cropland Data Layer ${e.anios.join('–')} (30 m): ${(z.cdl||[]).slice().sort((a,b)=>a.anio-b.anio).map(x=>`${x.cultivo?nom(C(x.cultivo)):'?'} (${x.codigo??'-'})`).join(' → ')}`));

    if(s.n_gkg != null) e.evidencia.push(TR(`🧪 Your soil's natural nitrogen reserve: ${s.n_gkg<1?'low':s.n_gkg<2?'medium':'good'}${s.quimicaEstimada?' (estimated)':''}.`,`🧪 Reserva natural de nitrógeno de su suelo: ${s.n_gkg<1?'baja':s.n_gkg<2?'media':'buena'}${s.quimicaEstimada?' (estimada)':''}.`,

    // RISKS (need local review)
    cul.filter(p => p.forzado).forEach(p => e.riesgos.push(LG(`${nom(p.c)} has no safe planting month here (frost or cold).`,`${nom(p.c)} no tiene un mes de siembra seguro aquí (helada o frío).`)));

    if(m.cobSuelo > 40 && (z.clima.lluvia.reduce((a,b)=>a+b,0) < 600)) e.riesgos.push(LG(`In a dry place the cover crop uses ~${A(m.cobSuelo)} of soil water per year: end it early in spring.`,`En un lugar seco la cobertura gasta ~${A(m.cobSuelo)} de agua del suelo por año: termínela temprano en primavera.`));

      const a = act.m;
      if(m.riego - a.riego > 15) e.riesgos.push(LG(`💧 Needs about ${A(m.riego - a.riego)} MORE irrigation per year than today (${VOL(m.riego - a.riego, estado.areaHa)} on your field): check your water.`,`💧 Necesita cerca de ${A(m.riego - a.riego)} MÁS de riego por año que hoy (${VOL(m.riego - a.riego, estado.areaHa)} en su lote): revise su agua.`));
      if(m.nComprar - a.nComprar > 10) e.riesgos.push(LG(`🌿 Buys about ${NHA(m.nComprar - a.nComprar)} more nitrogen per year than today.`,`🌿 Compra cerca de ${NHA(m.nComprar - a.nComprar)} más de nitrógeno por año que hoy.`));
      if(a.ingreso != null && m.ingreso != null && a.ingreso - m.ingreso > 20) e.riesgos.push(LG(`💵 About ${HA(a.ingreso - m.ingreso)} less gross income per year than today.`,`💵 Cerca de ${HA(a.ingreso - m.ingreso)} menos de ingreso bruto por año que hoy.`));
    }
    if(m.maizMaiz) e.riesgos.push(LG('Corn after corn: more rootworm and more nitrogen needed.','Maíz sobre maíz: más gusano de la raíz y más nitrógeno.'));
    if(!e.riesgos.length) e.riesgos.push(LG('No special risk found with our data; confirm with your Extension office.','No encontramos riesgos especiales con nuestros datos; confírmelo con su oficina de extensión.'));
  });
}

// 36-month timeline drawing
function lineaRotacion(e){
  const celdas = e.occ.map((v, i) => {
    const ini = v && v !== 'cob' && (i === 0 || e.occ[i-1] !== v || e.pl.some(p => p.t === i));
    const c = v && v !== 'cob' ? C(v) : null;
    const tip = `${M(i % 12)} ${LG('year','año')} ${Math.floor(i/12)+1}: ${v === null ? LG('bare soil','suelo desnudo') : v === 'cob' ? tx(COBERTURA.n) : nom(c)}`;
    return `<span class="rt ${v === null ? 'desn' : v === 'cob' ? 'cob' : 'cul f-' + c.fam}" title="${tip}">${ini ? c.emoji : ''}</span>`;
  }).join('');
  return `<div class="rtl">${celdas}</div><div class="rtAnios"><span>${LG('Year 1','Año 1')}</span><span>${LG('Year 2','Año 2')}</span><span>${LG('Year 3','Año 3')}</span></div>`;
}

// bar length = how GOOD the strategy is on that point (always: longer & greener = better); the number is the real value
function barraRot(etq, valor, pct){
  const p = Math.max(4, Math.min(100, pct)), col = p >= 60 ? '#6f9a4a' : p >= 35 ? '#d9a23b' : '#c0622d';
  return `<div class="rb"><span class="rbE">${etq}</span><span class="rbV">${valor}</span><span class="rbB"><i style="width:${p}%;background:${col}"></i></span></div>`;
}

function colorEsc(v,min,max,tipo){
  const t = Math.max(0, Math.min(1, (v-min)/(max-min)));
  const mix = (a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
  let c;
  if(tipo==='temp') c = t<.5 ? mix([70,120,210],[255,255,255],t*2) : mix([255,255,255],[205,60,45],(t-.5)*2);
  else if(tipo==='agua') c = mix([255,255,255],[40,100,200],t);
  else if(tipo==='et') c = mix([255,255,255],[230,120,30],t);
  else if(tipo==='ndvi') c = t<.35 ? mix([196,160,112],[255,255,255],t/.35) : mix([255,255,255],[46,139,87],(t-.35)/.65);
  else c = mix([255,255,255],[120,80,170],t);
  return `rgb(${c.join(',')})`;
}

function calendarioCalor(z, ocupados=[]){
  const filas = [

    [LG('High temp.','Temp. máxima')+` (${uT()})`, z.clima.tmax, -5, 40, 'temp', nT],
    [LG('Normal rain','Lluvia normal')+` (${uA()})`, z.clima.lluvia, 0, 130, 'agua', nA],

    [LG('Frost days','Días con helada'), z.clima.diasHelada, 0, 31, 'hel', v=>Math.round(v)]

  // Heat window: average high ≥ 32 °C (90 °F) · Frost window: ≥ 5 frost days in the month
  const ventanas = MES.en.map((_,i)=>(z.clima.tmax[i]>=32?'🔥':'')+(z.clima.diasHelada[i]>=5?'❄️':'')+(mesesDesnudo(z).includes(i)?'🟫':''));

    <small style="color:var(--gris)">${LG(`Green border = months the crop occupies / season analyzed. 🔥 heat (avg. high ≥ ${T(32)}) · ❄️ frost (≥5 frost days) · 🟫 field usually bare (NDVI &lt; ${NDVI_DESNUDO}).`,

}

function detalleAgua(){
  const z = Z(), r = evaluar(C(estado.cultivo), z, estado.mes);
  const etc = Array(12).fill(null); r.agua.filas.forEach(f=>etc[f.m]=f.etc);
  abrirModal(`
    <h2>💧 ${LG('Water — technical details','Agua — detalle técnico')}</h2>
    <div class="formula">${LG(
`ETc  = Kc × ET₀           (water the crop uses; Kc = FAO-56 crop coefficient)
Effective rain = 0.75 × normal rain × (1 + current anomaly)
Shortfall = Σ max(0, ETc − effective rain)  → what you would need to irrigate (net)
Gross water to pump = shortfall / system efficiency (drip 0.90 · sprinkler 0.80 · furrow 0.60)`,
`ETc  = Kc × ET₀           (agua que usa el cultivo; Kc = coeficiente del cultivo FAO-56)
Lluvia efectiva = 0.75 × lluvia normal × (1 + anomalía actual)
Déficit = Σ max(0, ETc − lluvia efectiva)  → lo que habría que regar (neto)
Agua bruta a bombear = déficit / eficiencia del sistema (goteo 0.90 · aspersión 0.80 · surcos 0.60)`)}</div>
    ${tablaAgua(r)}
    <div class="graf" style="height:300px"><canvas id="g1"></canvas></div>
    ${z.etReal ? `<p>${LG('🛰 <b>Green dashed line = OpenET</b>: water your field actually evaporated + transpired per month (average of past years, 30 m pixel). If it is much lower than Kc·ET₀ in summer, the field has been under water stress.','🛰 <b>Línea verde punteada = OpenET</b>: agua que su lote realmente evaporó + transpiró por mes (promedio de años pasados, píxel de 30 m). Si en verano es mucho menor que Kc·ET₀, el lote ha sufrido estrés hídrico.')}</p>`
               : `<p class="sub">${LG('Run the backend with an OpenET key to see the actual water use of your field.','Ejecute el backend con clave de OpenET para ver el uso real de agua de su lote.')}</p>`}
    ${z.eco ? `<h3>${LG('ECOSTRESS: how much water the plants were using','ECOSTRESS: cuánta agua estaban usando las plantas')}</h3><div class="graf"><canvas id="gEco"></canvas></div>
      <p class="sub">${LG(`Latent heat flux at the satellite overpass (BESS model, 70 m), nearest AppEEARS point (${z.eco.d} km). 1 W/m² ≈ 0.00147 mm/h of water evaporated. High values in summer = plants transpiring well; a sudden drop while ET₀ stays high = water stress.`,`Flujo de calor latente en el paso del satélite (modelo BESS, 70 m), punto AppEEARS más cercano (${z.eco.d} km). 1 W/m² ≈ 0.00147 mm/h de agua evaporada. Valores altos en verano = plantas transpirando bien; una caída brusca mientras ET₀ sigue alta = estrés hídrico.`)}</p>`:''}
    ${z.riego && z.riego.probable!=null ? `<h3>${LG('Is the field irrigated? (satellite evidence)','¿El lote tiene riego? (evidencia satelital)')}</h3>
      <div class="formula">${LG(`Summer (Jun–Aug) ${z.riego.fuente==='OpenET'?'actual ET':'ET₀ (air demand, no OpenET)'} = ${A(z.riego.etVerano)}   ·   summer rain = ${A(z.riego.lluviaVerano)}
If actual ET − rain > ~3 in (75 mm), the extra water must come from irrigation
(the soil can store roughly that much from spring). Result: ${z.riego.probable?'LIKELY IRRIGATED':'LIKELY RAIN-FED'}  (${z.riego.fuente})
Caveat: shallow groundwater or a wet spring can also explain extra ET.`,
`${z.riego.fuente==='OpenET'?'ET real':'ET₀ (demanda del aire, sin OpenET)'} de verano (jun–ago) = ${A(z.riego.etVerano)}   ·   lluvia de verano = ${A(z.riego.lluviaVerano)}
Si ET real − lluvia > ~75 mm, el agua extra tiene que venir del riego
(el suelo puede guardar más o menos eso desde la primavera). Resultado: ${z.riego.probable?'PROBABLE RIEGO':'PROBABLE SECANO'}  (${z.riego.fuente})
Ojo: un nivel freático alto o una primavera muy húmeda también pueden explicar ET extra.`)}</div>`:''}
    <p class="sub">${LG('The 75% effective rain is a simplification: part of the rain runs off or drains below the roots. SMAP helps validate whether the soil really is drier.','El 75% de lluvia efectiva es una simplificación: parte de la lluvia escurre o se infiltra más allá de las raíces. SMAP ayuda a validar si el suelo realmente está más seco.')}</p>`,
    ()=>{ grafLluvia('g1',z,etc);
      if(z.eco) graficas.push(new Chart(document.getElementById('gEco'),{type:'line',data:{labels:z.eco.serie.map(p=>p[0]),datasets:[{label:`ECOSTRESS ${z.eco.capa} (W/m²)`,data:z.eco.serie.map(p=>p[1]),borderColor:'#a8492a',backgroundColor:'#a8492a',showLine:false,pointRadius:4}]},
        options:{maintainAspectRatio:false,plugins:{title:{display:true,text:LG('Plant water use seen by ECOSTRESS (2026)','Uso de agua de las plantas visto por ECOSTRESS (2026)')}}}})); });
}

function detallePlagas(){
  const c = C(estado.cultivo), prev = C(estado.resp.anterior), pl = estado.resp.plagas || [];
  const sinPrev = !prev && estado.resp.anterior!=='descanso', sinPl = !pl.length || pl.includes('nose');
  const NE = LG('❓ Cannot be assessed','❓ No se puede evaluar'), SI = LG('✅ Yes','✅ Sí'), NO = '❌ No';
  abrirModal(`
    <h2>🐛 ${LG('Pests — technical details','Plagas — detalle técnico')}</h2>
    <p>${LG('<b>Important:</b> no satellite measures pests directly. This result is based on <b>your answers</b> and on <b>agronomic rotation rules</b>.','<b>Importante:</b> ningún satélite mide plagas directamente. Este resultado se basa en <b>sus respuestas</b> y en <b>reglas agronómicas</b> de rotación.')}</p>
    <table class="t"><tr><th>${LG('Rule','Regla')}</th><th>${LG('Risk','Riesgo')}</th><th>${LG('Applies?','¿Aplica?')}</th></tr>
      <tr><td class="izq">${LG('Same crop as last season','Mismo cultivo que la temporada anterior')}</td><td>${LG('High','Alto')}</td><td>${sinPrev?NE:prev&&prev.id===c.id?SI:NO}</td></tr>
      <tr><td class="izq">${LG('Same botanical family as last season','Misma familia botánica que el anterior')}</td><td>${LG('Medium','Medio')}</td><td>${sinPrev?NE:prev&&prev.fam===c.fam&&prev.id!==c.id?SI:NO}</td></tr>
      <tr><td class="izq">${LG('Farmer reports pests of this crop','El agricultor reporta plagas de este cultivo')}</td><td>${LG('High','Alto')}</td><td>${sinPl?NE:pl.some(p=>p!=='ninguno')?SI:NO}</td></tr></table>
    ${(sinPrev||sinPl)?`<p>⚠️ ${LG('Because data is missing, the result is <b>"Check as a precaution"</b> and not "low risk": not knowing is not the same as being fine.','Como faltan datos, el resultado es <b>"Revisar por precaución"</b> y no "riesgo bajo": no saber no es lo mismo que estar bien.')}</p>`:''}
    <p>${LG('Previous','Anterior')}: <b>${prev?nom(prev)+' ('+famNom(prev.fam)+')':LG('unknown','desconocido')}</b> · ${LG('Chosen','Elegido')}: <b>${nom(c)} (${famNom(c.fam)})</b></p>
    <p class="sub">${LG('Why does the family matter? Crops in the same family share pests and diseases; rotating to another family "breaks" the cycle because the pest runs out of food.','¿Por qué importa la familia? Los cultivos de la misma familia comparten plagas y enfermedades; rotar a otra familia "corta" su ciclo porque la plaga se queda sin alimento.')}</p>`);
}

function detalleSuelo(){
  const z = Z(), s = z.suelo;
  abrirModal(`
    <h2>🟫 ${LG('Soil and erosion — technical details','Suelo y erosión — detalle técnico')}</h2>
    <table class="t"><tr><th>${LG('Texture','Textura')}</th><th>${LG('Drainage','Drenaje')}</th><th>${LG('Organic matter','Materia orgánica')}</th><th>${LG('Hydrologic group','Grupo hidrológico')}</th><th>${LG('Slope','Pendiente')}</th></tr>
      <tr><td>${textura(s.textura)}</td><td>${drenaje(s.drenaje)}</td><td>${MO(s)}%</td><td>${s.grupoHidro??'?'}</td><td>${s.pendiente??'?'}%</td></tr></table>
    <p class="sub">${LG('Hydrologic group: A = infiltrates fast … D = infiltrates very slowly (more runoff). Sources: USDA SSURGO (soil), SRTM 30 m (slope).','Grupo hidrológico: A = infiltra rápido … D = infiltra muy lento (más escorrentía). Fuentes: USDA SSURGO (suelo), SRTM 30 m (pendiente).')}</p>
    <div class="formula">${LG(
`Erosion points: slope (>2% +1, >6% +2) + silty soil (+1) + row crop (+1)
 + rills observed (+1) / gullies (+2) + hydrologic group C/D (+1) − cover crop (−1)
≥4 high · 2–3 medium · ≤1 low`,
`Puntos de erosión: pendiente (>2% +1, >6% +2) + suelo limoso (+1) + cultivo en surcos (+1)
 + surcos observados (+1) / cárcavas (+2) + grupo hidrológico C/D (+1) − cultivo de cobertura (−1)
≥4 alto · 2–3 medio · ≤1 bajo`)}</div>
    <h3>🧪 ${LG('Soil chemistry (0–5 cm)','Química del suelo (0–5 cm)')}</h3>
    <table class="t"><tr><th>${LG('Total nitrogen','Nitrógeno total')}</th><th>${LG('Organic carbon','Carbono orgánico')}</th><th>C:N</th><th>pH</th><th>${LG('Source','Fuente')}</th></tr>
      <tr><td>${s.n_gkg!=null?(s.quimicaEstimada?'≈ ':'')+s.n_gkg.toFixed(2)+' g/kg':'—'}</td><td>${s.soc_gkg!=null?(s.quimicaEstimada?'≈ ':'')+s.soc_gkg.toFixed(1)+' g/kg':'—'}</td><td>${s.quimicaEstimada?LG('11 (assumed)','11 (supuesto)'):s.n_gkg&&s.soc_gkg?(s.soc_gkg/s.n_gkg).toFixed(1):'—'}</td><td>${s.ph!=null?s.ph.toFixed(1):'—'}</td><td>${s.quimicaEstimada?LG('≈ estimated from SSURGO organic matter (SoilGrids unavailable)','≈ estimado con la materia orgánica de SSURGO (SoilGrids no disponible)'):'SoilGrids 250 m'}${s.ph!=null?' · pH '+(s.phFuente||'SSURGO'):''}</td></tr></table>
    <div class="formula">${LG(
`Units: SoilGrids stores integers → nitrogen cg/kg ÷ 100 = g/kg · SOC dg/kg ÷ 10 = g/kg · pH×10 ÷ 10
Total N in topsoil: < 1 g/kg low · 1–2 medium · > 2 high
C:N < 12 → residue releases N fast · > 20 → microbes immobilize N
Mineralization needs water AND air: SMAP 16–34 % vol good · > 34 % leaching/denitrification · < 16 % slow`,
`Unidades: SoilGrids guarda enteros → nitrógeno cg/kg ÷ 100 = g/kg · COS dg/kg ÷ 10 = g/kg · pH×10 ÷ 10
N total superficial: < 1 g/kg bajo · 1–2 medio · > 2 alto
C:N < 12 → el rastrojo libera N rápido · > 20 → los microbios inmovilizan N
La mineralización necesita agua Y aire: SMAP 16–34 % vol bien · > 34 % lixiviación/desnitrificación · < 16 % lenta`)}</div>
    <h3>${LG('Field map','Mapa del lote')}</h3>
    <div id="mapaDet"></div>
    ${z.capas && (z.capas.ndvi||z.capas.pendiente) ? `<p class="sub">${LG('Use the layer button (top right of the map) to switch NDVI (Sentinel-2, vegetation vigor) and slope (SRTM).','Use el botón de capas (arriba a la derecha del mapa) para ver NDVI (Sentinel-2, vigor de la vegetación) y pendiente (SRTM).')}</p>`
      : `<div class="placeholder">🗺 ${LG('NDVI (Sentinel-2) and slope (SRTM) color layers appear here when the backend generates them.','Aquí aparecen las capas de color de NDVI (Sentinel-2) y pendiente (SRTM) cuando el backend las genera.')}</div>`}`,
    ()=>{
      mapaDet = L.map('mapaDet').setView(estado.latlng || [z.lat,z.lon], 13);
      const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri World Imagery'}).addTo(mapaDet);
      const over = {};
      COPERNICUS_CAPAS.forEach(([id,n],i)=>{ over[tx(n)] = capaCopernicus(id); if(i===0) over[tx(n)].addTo(mapaDet); });
      if(z.capas && z.capas.ndvi) over['NDVI (Sentinel-2, backend)'] = L.imageOverlay(z.capas.ndvi, z.capas.bounds, {opacity:.65});
      if(z.capas && z.capas.pendiente) over[LG('Slope (SRTM)','Pendiente (SRTM)')] = L.imageOverlay(z.capas.pendiente, z.capas.bounds, {opacity:.65});
      if(Object.keys(over).length) L.control.layers({'Satellite':sat}, over, {collapsed:false}).addTo(mapaDet);
      leyendaCopernicus(mapaDet);
      L.circleMarker(estado.latlng || [z.lat,z.lon],{radius:8,color:'#c0392b',fillColor:'#e74c3c',fillOpacity:.9}).addTo(mapaDet);
    });
}

function detalleMercado(){
  const z = Z(), c = C(estado.cultivo), rend = z.rendimiento[c.id], real = z.precios && z.precios[c.id];
  abrirModal(`
    <h2>💵 ${LG('Market — technical details','Mercado — detalle técnico')}</h2>
    <table class="t"><tr><th>${LG('Price','Precio')}</th><th>${LG('Historical yield (county)','Rendimiento histórico (condado)')}</th><th>${LG('Gross income','Ingreso bruto')}</th></tr>
      <tr><td>$${fmt(precioDe(c))} / t ${real?'':'('+LG('example','ejemplo')+')'}</td><td>${rend?REND(rend):LG('No data','Sin dato')}</td><td>${rend?HA(rend*precioDe(c)):'—'}</td></tr></table>
    ${rend ? `<p>${LG(`Your field: <b>${AREA(estado.areaHa)}</b> → harvest ≈ <b>${PROD(rend*estado.areaHa)}</b> → gross income ≈ <b>${USD(rend*precioDe(c)*estado.areaHa)}</b>`,`Su lote: <b>${AREA(estado.areaHa)}</b> → cosecha ≈ <b>${PROD(rend*estado.areaHa)}</b> → ingreso bruto ≈ <b>${USD(rend*precioDe(c)*estado.areaHa)}</b>`)}</p>`:''}
    <div class="formula">${LG('Gross income ≈ average NASS yield (last 5 years) × latest price received (NASS) or cash price (AMS)\nDoes not include costs (seed, fertilizer, machinery, irrigation).',
                              'Ingreso bruto ≈ rendimiento promedio NASS (últimos 5 años) × último precio recibido (NASS) o precio de contado (AMS)\nNo incluye costos (semilla, fertilizante, maquinaria, riego).')}</div>
    ${z.preciosHist && z.preciosHist[c.id] ? '<div class="graf"><canvas id="g1"></canvas></div>'
      : `<div class="placeholder">📈 ${LG('The price trend of the last 12 months appears here with the backend (NASS).','Aquí aparece la tendencia del precio de los últimos 12 meses con el backend (NASS).')}</div>`}`,
    ()=>{ const h = z.preciosHist && z.preciosHist[c.id]; if(!h) return;
      graficas.push(new Chart(document.getElementById('g1'),{type:'line',data:{labels:h.map(p=>p.fecha),datasets:[{label:'USD/t',data:h.map(p=>p.usd_t),borderColor:'#8a5a2b',tension:.3}]},
        options:{maintainAspectRatio:false,plugins:{title:{display:true,text:LG('Price received by farmers (NASS)','Precio recibido por agricultores (NASS)')}}}})); });
}

document.addEventListener('keydown', e => { if(e.key==='Escape') cerrarModal(); });
aplicarTextosEstaticos();
</script>
